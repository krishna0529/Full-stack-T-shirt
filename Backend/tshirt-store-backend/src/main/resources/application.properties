spring.application.name=tshirt-store-backend

server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tshirt_store?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload / Multipart Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=9a2f8c4e7b1d3a5f6e8c9d0b2a4f6e8c9d0b2a4f6e8c9d0b2a4f6e8c9d0b2a4f
jwt.expiration=86400000

# Payment Gateway (Razorpay)
payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_agrox12345}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:agroxsecretkey12345}
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:agroxwebhooksecret12345}


